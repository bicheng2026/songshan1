/* 首屏先套用已保存的字号/行距/留白，避免闪一下再变 */
(function () {
  try {
    function q(k, d, lo, hi) {
      var v = parseInt(localStorage.getItem(k), 10);
      return (isNaN(v) || v < lo || v > hi) ? d : v;
    }
    var fs = q("sx_fs", 100, 85, 150);
    var lh = q("sx_lh", 205, 150, 240);
    var sp = q("sx_sp", 140, 80, 200);
    var w = q("sx_w2", 1180, 860, 2400);
    var d = document.documentElement;
    d.style.setProperty("--fs", fs / 100);
    d.style.setProperty("--lh", lh / 100);
    d.style.setProperty("--sp", sp / 100);
    d.style.setProperty("--page-w", w >= 2400 ? "none" : w + "px");
    d.setAttribute("data-fs", fs);
    d.setAttribute("data-lh", lh);
    d.setAttribute("data-sp", sp);
    d.setAttribute("data-w", w);
  } catch (e) { }
})();
</script>
