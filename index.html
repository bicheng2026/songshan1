/* 首屏先套用已保存的字号/间距，避免闪一下再变 */
(function () {
  try {
    var FS = [0.90, 1, 1.09, 1.18, 1.28];
    var SP = [[0.92, 1.66], [1.06, 1.80], [1.18, 1.95], [1.32, 2.10]];
    var f = parseInt(localStorage.getItem("sx_fs"), 10);
    var s = parseInt(localStorage.getItem("sx_sp"), 10);
    if (isNaN(f) || f < 0 || f > 4) f = 1;
    if (isNaN(s) || s < 0 || s > 3) s = 2;
    var d = document.documentElement;
    d.style.setProperty("--fs", FS[f]);
    d.style.setProperty("--sp", SP[s][0]);
    d.style.setProperty("--lh", SP[s][1]);
    d.setAttribute("data-fs", f);
    d.setAttribute("data-sp", s);
  } catch (e) { }
})();
</script>
